name: Test computational companion

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Run exact tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce paper example
        run: collatz-boundary --json
      - name: Verify publication site
        run: python tools/check_site.py
